openapi: 3.0.3
info:
  title: Casino Backend API
  description: |
    API REST para el Casino Virtual - Proyecto educativo con vulnerabilidades intencionales.

    ⚠️ **ADVERTENCIA**: Este API contiene vulnerabilidades intencionales con fines educativos.
    NO debe ser utilizado en producción.
  version: 1.0.0
  contact:
    name: Seguridad en Aplicaciones Web

servers:
  - url: http://localhost:8080
    description: Servidor de desarrollo local

tags:
  - name: Authentication
    description: Endpoints de autenticación
  - name: User Profile
    description: Gestión de perfil de usuario
  - name: Balance
    description: Gestión de saldo del jugador
  - name: Bets
    description: Gestión de apuestas de ruleta

paths:
  /health:
    get:
      summary: Health check
      description: Verifica el estado del servidor
      responses:
        '200':
          description: Servidor funcionando correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/register:
    post:
      tags:
        - Authentication
      summary: Registrar nuevo usuario
      description: Crea una nueva cuenta de jugador con balance inicial de $1000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  example: player1
                email:
                  type: string
                  format: email
                  example: player1@example.com
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: password123
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
                  user:
                    $ref: '#/components/schemas/UserResponse'
        '400':
          description: Datos de entrada inválidos
        '409':
          description: Usuario o email ya existe

  /api/login:
    post:
      tags:
        - Authentication
      summary: Iniciar sesión
      description: Autenticar usuario y obtener token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: player1@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/UserResponse'
        '401':
          description: Credenciales inválidas

  /api/user/profile:
    get:
      tags:
        - User Profile
      summary: Obtener perfil de usuario
      description: Retorna el perfil del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil de usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: No autenticado
        '404':
          description: Usuario no encontrado

    put:
      tags:
        - User Profile
      summary: Actualizar perfil de usuario
      description: Actualiza username y/o email del usuario autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: player1_updated
                email:
                  type: string
                  format: email
                  example: player1_new@example.com
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Profile updated successfully
                  user:
                    $ref: '#/components/schemas/UserResponse'
        '400':
          description: Datos inválidos
        '401':
          description: No autenticado
        '409':
          description: Username o email ya existe

  /api/user/profile/{id}:
    get:
      tags:
        - User Profile
      summary: Obtener perfil de usuario por ID (VULNERABLE - IDOR)
      description: |
        ⚠️ **VULNERABILIDAD INTENCIONAL: IDOR (Insecure Direct Object Reference)**

        Este endpoint permite a cualquier usuario autenticado ver el perfil de CUALQUIER otro usuario
        simplemente cambiando el parámetro ID. No hay verificación de autorización.

        **Explotación:**
        - Enumerar IDs de usuarios (1, 2, 3...)
        - Obtener información sensible: email, balance, rol
        - Identificar cuentas objetivo para otros ataques

        **Esto es intencional para fines educativos - NO usar en producción.**
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del usuario a consultar
          example: 5
      responses:
        '200':
          description: Perfil de usuario obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileWithBalance'
        '400':
          description: ID de usuario inválido
        '401':
          description: No autenticado
        '404':
          description: Usuario no encontrado
        '500':
          description: Error del servidor

  /api/balance:
    get:
      tags:
        - Balance
      summary: Consultar balance
      description: Obtiene el balance actual del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Balance del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '401':
          description: No autenticado
        '404':
          description: Balance no encontrado

  /api/balance/add:
    post:
      tags:
        - Balance
      summary: Acreditar balance
      description: |
        ⚠️ VULNERABLE: Agrega fondos al balance sin validación.
        No verifica bet_id, no comprueba duplicados, no usa transacciones.
        El frontend puede llamar este endpoint múltiples veces para explotar race conditions.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  format: double
                  description: Monto a acreditar (sin validación)
                  example: 1000.50
      responses:
        '200':
          description: Balance actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Balance updated successfully
                  balance:
                    $ref: '#/components/schemas/Balance'
        '400':
          description: Datos inválidos
        '401':
          description: No autenticado

  /api/balance/deduct:
    post:
      tags:
        - Balance
      summary: Debitar balance
      description: |
        ⚠️ VULNERABLE: Deduce fondos del balance sin validación.
        No verifica saldo suficiente, permite balances negativos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  format: double
                  description: Monto a debitar (sin verificar saldo)
                  example: 50.00
      responses:
        '200':
          description: Balance actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Balance deducted successfully
                  balance:
                    $ref: '#/components/schemas/Balance'
        '400':
          description: Datos inválidos
        '401':
          description: No autenticado

  /api/bets:
    post:
      tags:
        - Bets
      summary: Registrar apuesta
      description: |
        ⚠️ VULNERABLE: Solo registra la apuesta, no la procesa.
        No verifica balance, no deduce fondos, no determina ganador, no acredita premios.
        El frontend controla toda la lógica del juego (insecure trust boundary).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BetRequest'
      responses:
        '200':
          description: Apuesta registrada (no procesada)
          content:
            application/json:
              schema:
                type: object
                properties:
                  bet_id:
                    type: integer
                    description: ID de la apuesta registrada
                    example: 123
        '400':
          description: Datos inválidos
        '401':
          description: No autenticado

    get:
      tags:
        - Bets
      summary: Ver historial de apuestas
      description: Obtiene todas las apuestas del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de apuestas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bet'
        '401':
          description: No autenticado

  /api/bets/{id}:
    get:
      tags:
        - Bets
      summary: Ver detalle de apuesta
      description: Obtiene el detalle de una apuesta específica
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la apuesta
          schema:
            type: integer
            example: 123
      responses:
        '200':
          description: Detalle de la apuesta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bet'
        '400':
          description: ID inválido
        '401':
          description: No autenticado
        '404':
          description: Apuesta no encontrada

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido del endpoint /api/login

  schemas:
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: player1
        email:
          type: string
          format: email
          example: player1@example.com
        role:
          type: string
          enum: [player, admin]
          example: player
        created_at:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00Z

    UserProfileWithBalance:
      type: object
      description: Perfil de usuario con balance incluido (usado por endpoint IDOR vulnerable)
      properties:
        id:
          type: integer
          example: 5
        username:
          type: string
          example: player5
        email:
          type: string
          format: email
          example: player5@example.com
        role:
          type: string
          enum: [player, admin]
          example: player
        created_at:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00Z
        balance:
          type: number
          format: double
          example: 1250.50
          description: Balance actual del usuario
        balance_updated_at:
          type: string
          format: date-time
          example: 2024-01-16T14:25:00Z
          description: Última actualización del balance

    Balance:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        amount:
          type: number
          format: double
          example: 1250.50
        updated_at:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00Z

    BetRequest:
      type: object
      required:
        - bet_type
        - bet_value
        - bet_amount
      properties:
        bet_type:
          type: string
          enum: [number, color]
          description: Tipo de apuesta
          example: number
        bet_value:
          type: string
          description: Número (0-36, 00) o color (red, black, green)
          example: "17"
        bet_amount:
          type: number
          format: double
          description: Monto a apostar
          example: 50.00

    Bet:
      type: object
      properties:
        id:
          type: integer
          example: 123
        user_id:
          type: integer
          example: 1
        bet_type:
          type: string
          enum: [number, color]
          example: number
        bet_value:
          type: string
          example: "17"
        bet_amount:
          type: number
          format: double
          example: 50.00
        winning_number:
          type: string
          example: "17"
        winning_color:
          type: string
          example: black
        result:
          type: string
          enum: [win, loss]
          example: win
        payout:
          type: number
          format: double
          example: 1800.00
        created_at:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00Z

    BetResult:
      type: object
      properties:
        bet_id:
          type: integer
          example: 123
        result:
          type: string
          enum: [win, loss]
          example: win
        winning_number:
          type: string
          example: "17"
        winning_color:
          type: string
          example: black
        payout:
          type: number
          format: double
          example: 1800.00
        new_balance:
          type: number
          format: double
          example: 2750.00
